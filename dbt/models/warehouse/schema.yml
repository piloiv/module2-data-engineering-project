version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null, unique]
  - name: dim_product
    columns:
      - name: product_key
        tests: [not_null, unique]
      - name: product_id
        tests: [not_null, unique]
  - name: dim_seller
    columns:
      - name: seller_key
        tests: [not_null, unique]
      - name: seller_id
        tests: [not_null, unique]
  - name: fact_sales
    description: Order-item fact table. Product GMV is price only; GTV is price plus freight_value. Order-level payment totals are modeled separately to avoid double-counting.
    columns:
      - name: order_id
        tests: [not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: seller_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_key
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['approved', 'canceled', 'created', 'delivered', 'invoiced', 'processing', 'shipped', 'unavailable']
  - name: fact_order_payment
    description: Order-level payment fact table. Preserves customer payment totals separately from order-item sales rows.
